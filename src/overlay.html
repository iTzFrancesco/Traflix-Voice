<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traflix Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .overlay-widget {
            height: 38px;
            background: rgba(17, 17, 17, 0.95);
            border: 1px solid rgba(255, 140, 0, 0.35);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0 10px 0 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .overlay-widget:hover {
            border-color: rgba(255, 140, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.1);
        }
        .overlay-widget.recording {
            padding: 0 10px 0 8px;
            border-color: rgba(255, 140, 0, 0.5);
            box-shadow: 0 0 12px rgba(255, 140, 0, 0.12);
        }
        .overlay-widget.processing {
            border-color: rgba(255, 140, 0, 0.3);
        }

        /* Logo */
        .logo-wrap {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }
        .logo-wrap img {
            width: 26px;
            height: 26px;
            border-radius: 6px;
        }

        /* Text label — gradient arancione */
        .text-label {
            font-size: 0.82rem;
            font-weight: 800;
            white-space: nowrap;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #ff8c00 0%, #ffb347 50%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: opacity 0.25s ease, width 0.3s ease, margin 0.3s ease;
            overflow: hidden;
        }

        /* Recording: nasconde testo, mostra barre */
        .overlay-widget.recording .text-label {
            opacity: 0;
            width: 0 !important;
            margin: 0;
        }

        /* Processing: nasconde testo, mostra spinner al suo posto */
        .overlay-widget.processing .text-label {
            opacity: 0;
            width: 0 !important;
            margin: 0;
        }

        /* Spinner — inline, prende il posto della scritta */
        .spinner-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        }
        .overlay-widget.processing .spinner-wrap {
            width: 20px;
            opacity: 1;
        }
        .spinner-ring {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: #ff8c00;
            border-right-color: rgba(255, 140, 0, 0.3);
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Bars visualizer — inline, prende il posto della scritta durante recording */
        .viz-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        }
        .overlay-widget.recording .viz-wrap {
            width: 80px;
            opacity: 1;
        }
        .bar {
            width: 2.5px;
            background: #ff8c00;
            border-radius: 2px;
            height: 3px;
            transition: height 0.08s ease;
            box-shadow: 0 0 4px rgba(255, 140, 0, 0.35);
            flex-shrink: 0;
        }

        .overlay-widget {
            cursor: grab;
        }
        .overlay-widget:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div class="overlay-widget idle" id="widget">
        <div class="logo-wrap">
            <img src="assets/logo.png" alt="Traflix" draggable="false" />
        </div>
        <span class="text-label" id="text-label">Traflix Voice</span>
        <div class="spinner-wrap"><div class="spinner-ring"></div></div>
        <div class="viz-wrap" id="viz-wrap"></div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;

        const { getCurrentWindow } = window.__TAURI__.window;
        const appWindow = getCurrentWindow();

        const widget = document.getElementById("widget");
        const vizWrap = document.getElementById("viz-wrap");

        function resizeToFit() {
            requestAnimationFrame(() => {
                const w = widget.offsetWidth + 4;
                const h = widget.offsetHeight + 4;
                appWindow.setSize(new window.__TAURI__.window.LogicalSize(w, h));
            });
        }

        // Create bars
        const NUM_BARS = 14;
        const bars = [];
        const barHeights = new Array(NUM_BARS).fill(3);
        const barTargets = new Array(NUM_BARS).fill(3);

        for (let i = 0; i < NUM_BARS; i++) {
            const bar = document.createElement("div");
            bar.className = "bar";
            vizWrap.appendChild(bar);
            bars.push(bar);
        }

        let currentVolume = 0;
        let targetVolume = 0;

        // Notification sounds
        const startSound = new Audio("assets/sounds/start.wav");
        const stopSound = new Audio("assets/sounds/stop.wav");
        startSound.volume = 1.0;
        stopSound.volume = 1.0;

        // Drag via startDragging on every mousedown; double-click to open main
        let lastClick = 0;

        widget.addEventListener("mousedown", (e) => {
            const now = Date.now();
            if (now - lastClick < 300) {
                lastClick = 0;
                window.__TAURI__.event.emit("show_main_window", {}).catch(() => {});
                return;
            }
            lastClick = now;
            appWindow.startDragging();
        });

        listen("python_output", (event) => {
            try {
                const data = JSON.parse(event.payload);

                if (data.status === "listening") {
                    widget.className = "overlay-widget recording";
                    startSound.currentTime = 0;
                    startSound.play().catch(() => {});
                    setTimeout(resizeToFit, 350);
                }
                else if (data.status === "processing") {
                    widget.className = "overlay-widget processing";
                    targetVolume = 0;
                    stopSound.currentTime = 0;
                    stopSound.play().catch(() => {});
                    setTimeout(resizeToFit, 350);
                }
                else if (data.status === "result" || data.status === "ready") {
                    if (widget.classList.contains("processing") || widget.classList.contains("recording")) {
                        widget.className = "overlay-widget idle";
                        targetVolume = 0;
                        setTimeout(resizeToFit, 350);
                    }
                }
                else if (data.status === "volume") {
                    targetVolume = data.value;
                }
            } catch (_) {}
        });

        // Animate bars
        function animateBars() {
            requestAnimationFrame(animateBars);

            currentVolume += (targetVolume - currentVolume) * 0.2;
            if (currentVolume < 0.5) currentVolume = 0;

            const volNorm = currentVolume / 100;
            const maxH = 20;
            const minH = 3;

            for (let i = 0; i < NUM_BARS; i++) {
                const center = NUM_BARS / 2;
                const dist = Math.abs(i - center) / center;
                const bellFactor = 1 - dist * 0.5;
                const jitter = 0.6 + Math.random() * 0.4;

                barTargets[i] = minH + volNorm * maxH * bellFactor * jitter;
                barHeights[i] += (barTargets[i] - barHeights[i]) * 0.25;

                const h = Math.max(minH, Math.min(maxH, barHeights[i]));
                bars[i].style.height = h + "px";

                const glow = (h / maxH) * 6;
                bars[i].style.boxShadow = `0 0 ${glow}px rgba(255, 140, 0, ${0.3 + (h / maxH) * 0.4})`;
            }
        }

        animateBars();
        resizeToFit();
    </script>
</body>
</html>
