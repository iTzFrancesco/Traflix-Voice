[env]
# Portable binaries must also run on CPUs older than the build runner.
TRANSCRIBE_CMAKE_ARGS = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_NATIVE=OFF -DGGML_VULKAN_SHADER_TYPES=f32,f16,q8_0 -DGGML_VULKAN_MUL_MAT_ID=OFF"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
