[package]
name = "traflix-transcriber"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same immutable runtime revision as Hex 3.0.0.
transcribe-cpp = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca" }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca", features = ["vulkan"] }

[profile.release]
strip = true
