name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rust:
    name: Check Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-release-
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: pwsh -File ..\scripts\test-rust.ps1

  check-python:
    name: Check Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src-tauri/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r src-tauri/requirements.txt
          pip install pytest
      - run: python -m py_compile src-tauri/whisper_engine.py
      - if: hashFiles('src-tauri/test_whisper_engine.py') != ''
        run: python -m pytest src-tauri/test_whisper_engine.py -v

  build-and-release:
    name: Build MSI & Release
    runs-on: windows-latest
    needs: [check-rust, check-python]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-release-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src-tauri/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r src-tauri/requirements.txt -r src-tauri/requirements-build.txt
      - name: Build signed updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY is required to sign desktop updates."
          }
          npm run tauri -- build --config src-tauri/tauri.updater.conf.json
      - name: Generate Windows update manifest
        run: node scripts/generate-updater-manifest.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/msi/latest.json
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
