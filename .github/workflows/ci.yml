name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile src-tauri/whisper_engine.py

  test-python:
    name: Test Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src-tauri/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r src-tauri/requirements.txt
          pip install pytest
      - if: hashFiles('src-tauri/test_whisper_engine.py') != ''
        run: python -m pytest src-tauri/test_whisper_engine.py -v

  build:
    name: Build (Windows MSI)
    runs-on: windows-latest
    needs: [lint-rust, lint-python]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src-tauri/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r src-tauri/requirements.txt
      - run: npm run tauri build
      - name: List MSI files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*.msi" src-tauri/target/release/bundle/ -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "Found MSI: $($_.FullName) ($($_.Length) bytes)" }
          if (-not (Get-ChildItem -Recurse -Filter "*.msi" src-tauri/target/release/bundle/ -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::No MSI files found in bundle directory"
            Get-ChildItem -Recurse -Filter "*.msi" src-tauri/target/release/ -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "Found MSI elsewhere: $($_.FullName)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: traflix-voice-windows
          path: src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
